name: Build and Test

on:
  push:
    branches-ignore: ["main"]
  pull_request:
    branches-ignore: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Build and Test api-gateway
        run: mvn -f api-gateway/pom.xml clean install

      - name: Build and Test auth-service
        run: mvn -f auth-service/pom.xml clean install

      - name: Build and Test trip-service
        run: mvn -f trip-service/pom.xml clean install

      - name: Build and Test suggestion-service
        run: mvn -f suggestion-service/pom.xml clean install
