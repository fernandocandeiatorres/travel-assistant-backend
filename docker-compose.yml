version: "3.8"

services:
  # --- INFRAESTRUTURA COMPARTILHADA ---

  postgres:
    image: "postgres:16-alpine"
    container_name: postgres_db
    environment:
      - "POSTGRES_PASSWORD=secret"
      - "POSTGRES_USER=myuser"
      # Usar um banco padrão genérico para evitar conflito com o script
      - "POSTGRES_DB=postgres" # Banco padrão do PostgreSQL
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Script para criar múltiplos bancos de dados
      - ./db-init:/docker-entrypoint-initdb.d

  rabbitmq:
    image: "rabbitmq:3-management-alpine"
    container_name: rabbitmq
    environment:
      - "RABBITMQ_DEFAULT_PASS=secret"
      - "RABBITMQ_DEFAULT_USER=myuser"
    ports:
      - "5672:5672"
      - "15672:15672"

  redis:
    image: "redis:7-alpine"
    container_name: redis_cache
    ports:
      - "6379:6379"

  # --- MICROSSERVIÇOS DA APLICAÇÃO ---
  trip-service:
    build:
      context: ./trip-service
      dockerfile: Dockerfile
    container_name: trip-service-app
    ports:
      - "8000:8000"
    environment:
      - SERVER_PORT=8000
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/trip_service_db
      - SPRING_DATASOURCE_USERNAME=myuser
      - SPRING_DATASOURCE_PASSWORD=secret
      - SPRING_RABBITMQ_HOST=rabbitmq
    depends_on:
      - postgres
      - rabbitmq
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:8000/actuator/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  suggestion-service:
    build:
      context: ./suggestion-service
      dockerfile: Dockerfile
    container_name: suggestion-service-app
    ports:
      - "8010:8010"
    environment:
      - SERVER_PORT=8010
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/suggestion_service_db
      - SPRING_DATASOURCE_USERNAME=myuser
      - SPRING_DATASOURCE_PASSWORD=secret
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_DATA_REDIS_HOST=redis
    depends_on:
      - postgres
      - rabbitmq
      - redis
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:8010/actuator/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: auth-service-app
    ports:
      - "8020:8020"
    environment:
      - SERVER_PORT=8020
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/auth_service_db
      - SPRING_DATASOURCE_USERNAME=myuser
      - SPRING_DATASOURCE_PASSWORD=secret
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_DATA_REDIS_HOST=redis
      - JWT_SECRET=413F4428472B4B6250655368566D5970337336763979244226452948404D6351
    depends_on:
      - postgres
      - rabbitmq
      - redis
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:8020/actuator/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway-app
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - TRIP_SERVICE_URL=http://trip-service:8000
      - SUGGESTION_SERVICE_URL=http://suggestion-service:8010
      - AUTH_SERVICE_URL=http://auth-service:8020
    depends_on:
      - trip-service
      - suggestion-service
      - auth-service
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:8080/actuator/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

# Define um volume nomeado para persistir os dados do PostgreSQL
volumes:
  postgres_data:
