server:
  port: 8020 # Corrigido para coincidir com docker-compose

jwt:
  secret: 413F4428472B4B6250655368566D5970337336763979244226452948404D6351
  expiration: 86400000 # 24 hours

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://localhost:5432/auth_service_db # Corrigido para usar a mesma porta do PostgreSQL
    username: myuser
    password: secret
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate # Mudado de 'update' para 'validate' - agora o Flyway gerencia o schema
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

  rabbitmq:
    host: localhost
    port: 5672
    username: myuser
    password: secret

  cache:
    type: redis

  data:
    redis:
      host: localhost
      port: 6379

  jackson:
    serialization:
      write-dates-as-timestamps: false
    modules:
      - com.fasterxml.jackson.datatype.jsr310.JavaTimeModule

