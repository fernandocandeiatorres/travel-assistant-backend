server:
  port: 8000

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

spring:
  application:
    name: trip-service
  cloud:
    consul:
      host: ${SPRING_CLOUD_CONSUL_HOST}
      port: ${SPRING_CLOUD_CONSUL_PORT}
      discovery:
        prefer-ip-address: true
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate # Mudado de 'update' para 'validate' - agora o Flyway gerencia o schema
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST}
    port: 5672
    username: ${SPRING_RABBITMQ_USERNAME}
    password: ${SPRING_RABBITMQ_PASSWORD}

# Resilience4j Circuit Breaker configuration
resilience4j:
  circuitbreaker:
    instances:
      suggestionService:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10 # últimas 10 chamadas
        failureRateThreshold: 50 # abre se 50% falharem
        waitDurationInOpenState: 10s # espera 10s antes de ir para HALF_OPEN
        permittedNumberOfCallsInHalfOpenState: 3 # permite 3 chamadas de teste
        automaticTransitionFromOpenToHalfOpenEnabled: true
        ignoreExceptions:
          - com.fernandodev.tripservice.exception.TripNotFoundException
        recordExceptions:
          - java.io.IOException
          - org.springframework.web.client.HttpServerErrorException
